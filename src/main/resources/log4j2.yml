Configuration:
  status: WARN
  name: YamlConfig

  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{HH:mm:ss} %-5p %c{1}:%L - %m%n"

    RollingFile:
      name: RollingFile
      fileName: logs/app.log
      filePattern: logs/app-%d{yyyy-MM-dd}.log.gz
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"
      Policies:
        TimeBasedTriggeringPolicy:
          interval: 15
          modulate: true
      DefaultRolloverStrategy:
        max: 10

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: RollingFile
        - ref: Console
