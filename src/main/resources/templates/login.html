<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Projeto Oanse</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonte divertida -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka One', cursive;
      background: linear-gradient(to right, #0077cc, #66ccff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      background-color: #fff;
    }

    .card-header {
      background-color: #ffc107;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;	  
      text-align: center;
    }

    .card-header h3 {
      margin: 0;
      color: #003366;
    }

    .logo {
	  align-self: center;
      width: 350px;
	  height: 80px;	  
	  border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      background-color: #0077cc;
      border: none;
    }

    .btn-primary:hover {
      background-color: #005fa3;
    }

    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card">
		  <img src="https://lh6.googleusercontent.com/SpI7brBB49qSSJtxpchwOX2aRYBKPNxcCFCQiEbAMOCJBOl5jHkY0dO7fmzIUZKsjaDcT3VNZVbny0491feGi9yiRHS4P7hE6kv42N1HT7yzs1SyWl7iCIfrxgQ8wAJODqAPF5HoCJw=w16383" class="logo img-fluid mx-auto d-block" >
          <div class="card-header py-4">            
			<h5>Seja bem vindo!</h5>
          </div>
          <div class="card-body p-4">
            <form method="post" th:action="@{/login}">
              <div class="mb-3">
                <label for="username" class="form-label">Login</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu login" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Entrar</button>
              </div>
            </form>
          </div>
          <div class="footer pb-3">
            <span>Crescendo com Jesus 💙</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
