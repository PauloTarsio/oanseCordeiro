<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Projeto Oanse</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Fonte divertida -->
	<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="/css/jqGrid.css">
</head>

<body>
	<!-- Logo fixa no topo -->
	<header class="bg-white shadow-sm fixed-top py-2">
		<div class="container">
			<div class="d-flex align-items-center justify-content-center gap-3">
				<img src="/imagens/logo-oanse.png" class="logo img-fluid" alt="Logo Oanse">
			</div>
		</div>
	</header>

	<div class="container" style="margin-top: 60px;">
		<div class="col-md-12">
			<div class="card">
				<div class="card-body">
					<!-- Filtro de pesquisa -->
					<fieldset class="p-3 border rounded">
						<legend id="legendaFormulario" class="w-auto px-2">Cadastro de Igrejas - PESQUISA</legend>

						<!-- Botões de ação -->
						<div class="d-flex justify-content-end mb-3">
							<button type="button" id="btnPesquisar" class="btn btn-primary me-2">Pesquisar</button>
							<button type="button" id="btnIncluir" class="btn btn-success">Incluir</button>
						</div>

						<div class="mb-3">
							<label for="descricao" class="form-label">Nome/Descrição</label>
							<input type="text" id="filtroDescricao" name="filtroDescricao" class="form-control"
								placeholder="Digite aqui e clique em pesquisar...">
						</div>

						<!-- Tabela jqGrid -->
						<div id="tabelaRegistros" class="w-100">
							<div id="jqGridPager"></div>
							<table id="jqGrid"></table>
						</div>
						<div class="footer text-center mt-3">
							<button type="button" id="btnVoltar" class="btn btn-secondary">Voltar</button>
						</div>
					</fieldset>
				</div>
			</div>
		</div>
	</div>

	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<!-- jqGrid (dependente de jQuery UI) -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/free-jqgrid@4.15.5/css/ui.jqgrid.min.css">
	<script src="https://cdn.jsdelivr.net/npm/free-jqgrid@4.15.5/js/jquery.jqgrid.min.js"></script>

	<!-- jQuery UI -->
	<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

	<!-- Bootstrap JS -->
	<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<!--<script src="/js/igreja/formulario.js"></script>-->
	<script src="/js/igreja/index.js"></script>
</body>

</html>
