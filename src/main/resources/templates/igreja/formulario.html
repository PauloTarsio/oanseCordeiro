<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Projeto Oanse</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Fonte divertida -->
	<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>
	<div class="col-md-12">
		<div class="card">
			<div class="card-body">
				<fieldset class="p-3 border rounded">
					<legend class="w-auto px-2">Cadastro de Igrejas</legend>
					<form id="formIgreja">
						<div class="mb-3">
							<label for="descricao" class="form-label">Nome/Descrição</label>
							<input type="text" class="form-control" id="descricao" name="dadosPessoais.descricao"
								required>
						</div>

						<div class="mb-3">
							<label for="tipo" class="form-label">Tipo</label>
							<select class="form-select" id="tipo" name="dadosPessoais.tipo" required>
								<option value="">Selecione</option>
								<option value="FISICA">Pessoa Física</option>
								<option value="JURIDICA">Pessoa Jurídica</option>
							</select>
						</div>

						<div class="row">
							<div class="col-md-4 mb-3">
								<label for="rg" class="form-label">RG</label>
								<input type="text" class="form-control" id="rg" name="dadosPessoais.rg">
							</div>
							<div class="col-md-4 mb-3">
								<label for="cpf" class="form-label">CPF</label>
								<input type="text" class="form-control" id="cpf" name="dadosPessoais.cpf">
							</div>
							<div class="col-md-4 mb-3">
								<label for="cnpj" class="form-label">CNPJ</label>
								<input type="text" class="form-control" id="cnpj" name="dadosPessoais.cnpj">
							</div>
						</div>

						<div class="mb-3">
							<label for="dataNascimento" class="form-label">Data de Nascimento</label>
							<input type="date" class="form-control" id="dataNascimento"
								name="dadosPessoais.dataNascimento" required>
						</div>

						<div class="row">
							<div class="col-md-4 mb-3">
								<label for="telefone1" class="form-label">Telefone 1</label>
								<input type="text" class="form-control" id="telefone1" name="dadosPessoais.telefone1"
									required>
							</div>
							<div class="col-md-4 mb-3">
								<label for="telefone2" class="form-label">Telefone 2</label>
								<input type="text" class="form-control" id="telefone2" name="dadosPessoais.telefone2">
							</div>
							<div class="col-md-4 mb-3">
								<label for="telefone3" class="form-label">Telefone 3</label>
								<input type="text" class="form-control" id="telefone3" name="dadosPessoais.telefone3">
							</div>
						</div>

						<div class="mb-3">
							<label for="email" class="form-label">E-mail</label>
							<input type="email" class="form-control" id="email" name="dadosPessoais.email">
						</div>

						<!-- Card: Endereço -->
						<div class="card mt-4">
							<div class="card-header bg-success text-white">
								<h5>Endereço</h5>
							</div>
							<div class="card-body">
								<div class="mb-3">
									<label for="rua" class="form-label">Rua</label>
									<input type="text" class="form-control" id="rua" name="dadosPessoais.endereco.rua"
										required>
								</div>

								<div class="row">
									<div class="col-md-4 mb-3">
										<label for="numero" class="form-label">Número</label>
										<input type="text" class="form-control" id="numero"
											name="dadosPessoais.endereco.numero">
									</div>
									<div class="col-md-8 mb-3">
										<label for="bairro" class="form-label">Bairro</label>
										<input type="text" class="form-control" id="bairro"
											name="dadosPessoais.endereco.bairro" required>
									</div>
								</div>

								<div class="row">
									<div class="col-md-10 mb-3">
										<label for="cidade" class="form-label">Cidade</label>
										<input type="text" class="form-control" id="cidade"
											name="dadosPessoais.endereco.cidade" required>
									</div>
									<div class="col-md-2 mb-3">
										<label for="uf" class="form-label">UF</label>
										<input type="text" class="form-control" id="uf" name="dadosPessoais.endereco.uf"
											maxlength="2" required>
									</div>
								</div>
							</div>
						</div>

						<div class="form-check mt-4">
							<input class="form-check-input" type="checkbox" value="true" id="ativo" name="ativo"
								checked>
							<label class="form-check-label" for="ativo">
								Igreja Ativa
							</label>
						</div>
						<div class="footer mt-4">
							<div class="form-check mt-2">
								<div class="d-grid mt-4">
									<button id="btnVoltar" type="button" class="btn btn-secondary">Voltar</button>
								</div>
								<div class="d-grid mt-4">
									<button id="btnSalvar" class="btn btn-primary">Salvar</button>
								</div>
							</div>
						</div>
					</form>
				</fieldset>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<div th:replace="~{fragments/modal-mensagem :: modal}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="/js/validarFormulario.js"></script>
	<script src="/js/igreja/formulario.js"></script>
</body>

</html>
