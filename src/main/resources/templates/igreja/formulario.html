<div th:replace="fragments/head :: head"></div>
<body>
	<div th:replace="fragments/modal-mensagem :: modal"></div>
	<div class="container mb-5" style="margin-top: 60px;">
		<div class="col-md-12">
			<form id="formIgreja">
				<div class="card-body">
					<fieldset class="p-3 border rounded">
						<legend id="legendaFormulario" class="w-auto px-2"></legend>
						<!-- Nav tabs -->
						<ul class="nav nav-tabs" id="formTabs" role="tablist">
							<li class="btn-group" role="presentation">
								<button class="btn btn-light active" id="pessoal-tab" data-bs-toggle="tab"
									data-bs-target="#pessoal" type="button" role="tab">
									Dados Pessoais
								</button>
							</li>
							<li class="nav-item" role="presentation">
								<button class="btn btn-light" id="endereco-tab" data-bs-toggle="tab"
									data-bs-target="#endereco" type="button" role="tab">
									Endereço
								</button>
							</li>
						</ul>

						<!-- Conteúdo das abas -->
						<div class="tab-content border border-top-0 p-3" id="formTabsContent">
							<!-- Aba Dados Pessoais -->
							<div class="tab-pane fade show active" id="pessoal" role="tabpanel">
								<form>
									<div th:replace="igreja/abas/dados_pessoais :: dadosPessoais"></div>
								</form>
							</div>

							<!-- Aba Endereço -->
							<div class="tab-pane fade" id="endereco" role="tabpanel">
								<form>
									<div th:replace="igreja/abas/endereco :: endereco"></div>
								</form>
							</div>								
						</div>							

						<div class="form-check mt-4">
							<input class="form-check-input" type="checkbox" value="true" id="ativo" name="ativo"
								checked>
							<label class="form-check-label" for="ativo">
								Igreja Ativa
							</label>
						</div>
						<div class="footer d-flex justify-content-end mb-3 mt-3">
							<button id="btnVoltar" type="button" class="btn btn-secondary me-2">Voltar</button>
							<button id="btnSalvar" class="btn btn-primary">Salvar</button>
						</div>
					</fieldset>
				</div>
			</form>
		</div>
	</div>
	<script src="/js/igreja/index.js"></script>
	<script src="/js/igreja/formulario.js"></script>
</body>
