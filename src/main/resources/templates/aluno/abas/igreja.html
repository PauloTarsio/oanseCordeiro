<div th:fragment="igreja">
	<div class="row mt-3">
		<div class="col-md-3">
			<label for="igrejaId" class="form-label">Código/Identificador</label>
			<div class="input-group">
				<input type="text" class="form-control" id="igrejaId" name="igreja.id" required>
				<span class="input-group-text">
					<i class="bi bi-search"></i>
				</span>
			</div>
		</div>
		<div class="col-md-9">
			<label for="igrejaDescricao" class="form-label">Nome</label>
			<input type="text" class="form-control" id="igrejaDescricao" disabled>
		</div>
	</div>
</div>
