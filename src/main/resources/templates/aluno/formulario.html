	<script>
$(function() {
    let fotoBase64 = "";
    $("#fotoAluno").on("change", function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                fotoBase64 = evt.target.result.split(",")[1];
                $("#imgPreview").attr("src", evt.target.result).show();
                $("#removerFoto").show();
            };
            reader.readAsDataURL(file);
        }
    });
    $("#removerFoto").on("click", function() {
        fotoBase64 = "";
        $("#imgPreview").attr("src", "").hide();
        $("#fotoAluno").val("");
        $("#removerFoto").hide();
    });
    // Ao salvar o aluno, inclua fotoBase64 no payload
    $("#formAluno").on("submit", function(e) {
        // ...código para coletar os dados do aluno...
        // Adicione fotoBase64 ao objeto de dados
        // Exemplo: dados.fotoBase64 = fotoBase64;
    });
});
</script>
