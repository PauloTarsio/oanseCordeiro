<div th:replace="fragments/head :: head"></div>

<body>
	<div th:replace="fragments/modal-mensagem :: modal"></div>
	<div th:replace="fragments/header :: header" disabled></div>
	<div class="container" style="margin-top: 60px;">
		<div class="col-md-12">
			<form id="formUsuario">
				<div class="card">
					<div class="card-body">
						<fieldset class="p-3 border rounded">
							<legend id="legendaFormulario" class="w-auto px-2"></legend>
							<!-- Nav tabs -->
							<ul class="nav nav-tabs" id="usuarioTabs" role="tablist">
								<li class="btn-group" role="presentation">
									<button class="btn btn-light active" id="dados-tab" data-bs-toggle="tab"
										data-bs-target="#dadosUsuario" type="button" role="tab">
										Dados do Usuário
									</button>
								</li>
								<li class="nav-item" role="presentation">
                                    <button class="btn btn-light" id="igreja-tab" data-bs-toggle="tab"
                                        data-bs-target="#igreja" type="button" role="tab">
                                        Igreja
                                    </button>
								</li>
							</ul>
							
							<!-- Conteúdo das abas -->
							<div class="tab-content border border-top-0 p-3" id="formTabsContent">
								<!-- Aba Dados do Usuário -->
                                <div class="tab-pane fade show active" id="dadosUsuario" role="tabpanel">
                                    <form>
                                        <div th:replace="usuario/abas/dados_usuario :: dadosUsuario"></div>
                                    </form>
                                </div>
								<!-- Aba Igreja-->
								<div class="tab-pane fade" id="igreja" role="tabpanel">
	                                <form>
	                                    <div th:replace="usuario/abas/igreja :: igreja"></div>
	                                </form>
								</div>
							</div>
							
							<div class="footer d-flex justify-content-end mb-3">
								<button id="btnVoltar" type="button" class="btn btn-secondary me-2">Voltar</button>
								<button id="btnSalvar" class="btn btn-primary">Salvar</button>
							</div>
						</fieldset>
					</div>
				</div>
			</form>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<div th:replace="~{fragments/modal-mensagem :: modal}"></div>
	<script th:inline="javascript">var perfil = /*[[${perfil}]]*/ "";</script>
	<script src="/js/lib/oanse-lib.js"></script>
	<script src="/js/usuario/formulario.js"></script>
</body>
