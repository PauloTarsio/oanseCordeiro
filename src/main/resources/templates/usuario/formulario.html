<div th:replace="fragments/head :: head"></div>

<body>
	<div th:replace="fragments/modal-mensagem :: modal"></div>
	<div th:replace="fragments/header :: header" disabled></div>
	<div class="container" style="margin-top: 60px;">
		<div class="col-md-12">
			<form id="formUsuario">
				<div class="card">
					<div class="card-body">
						<fieldset class="p-3 border rounded">
							<legend id="legendaFormulario" class="w-auto px-2"></legend>
							<!-- Nav tabs -->
							<ul class="nav nav-tabs" id="usuarioTabs" role="tablist">
								<li class="btn-group" role="presentation">
									<button class="btn btn-light active" id="dados-tab" data-bs-toggle="tab" data-bs-target="#dados"
										type="button" role="tab" aria-controls="dados" aria-selected="true">Dados do Usuário
									</button>
								</li>
							</ul>
							<!-- Tab panes -->
							<div class="tab-content border border-top-0 p-3" id="usuarioTabsContent">
								<div class="tab-pane fade show active" id="dados" role="tabpanel"
									aria-labelledby="dados-tab">
									<div class="card mt-4 form-control">
										<div class="card-header bg-success text-white">
											<h5>Dados do usuário</h5>
										</div>
										<div class="card-body">
											<div class="mb-3">
												<input type="hidden" id="id" name="usuario.id">
												<label for="login" class="form-label">Login</label>
												<input type="text" class="form-control" id="login" name="usuario.login"
													required>
											</div>
											<div class="mb-3">
												<label for="senha" class="form-label">Senha</label>
												<input type="text" class="form-control" id="senha" name="usuario.senha"
													required>
											</div>
											<div class="mb-3">
												<label for="perfil" class="form-label">Perfil</label>
												<select class="form-select" id="perfil" name="usuario.perfil" required>
													<option value="">Selecione</option>
													<option value="ADMIN">Administrador</option>
													<option value="SECRETARIO">Secretario</option>
													<option value="LIDER">Lider</option>
												</select>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="footer d-flex justify-content-end mb-3">
								<button id="btnVoltar" type="button" class="btn btn-secondary me-2">Voltar</button>
								<button id="btnSalvar" class="btn btn-primary">Salvar</button>
							</div>
						</fieldset>
					</div>
				</div>
			</form>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<div th:replace="~{fragments/modal-mensagem :: modal}"></div>
	<script src="/js/lib/oanse-lib.js"></script>
	<script src="/js/usuario/formulario.js"></script>
</body>
