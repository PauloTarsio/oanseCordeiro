<div th:replace="fragments/head :: head"></div>

<body>
	<div th:replace="fragments/modal-mensagem :: modal"></div>
	<header>
		<div th:replace="fragments/header :: header" disabled></div>
		</head>
	</header>
	<div class="container" style="margin-top: 60px;">
		<div class="col-md-12">
			<div class="card">
				<div class="card-body">
					<fieldset class="p-3 border rounded">
						<legend id="legendaFormulario" class="w-auto px-2"></legend>
						<div class="card mt-4 form-control">
							<div class="card-header bg-success text-white">
								<h5>Dados do usuário</h5>
							</div>
							<div class="card-body">
								<div class="mb-3">
									<input type="hidden" id="id" name="id">
									<label for="login" class="form-label">Login</label>
									<input type="text" class="form-control" id="login" name="usuario.login" required>
								</div>

								<div class="mb-3">
									<input type="hidden" id="id" name="id">
									<label for="senha" class="form-label">Senha</label>
									<input type="text" class="form-control" id="login" name="usuario.login" required>
								</div>

								<div class="mb-3">
									<label for="roles" class="form-label">Perfil</label>
									<select class="form-select" id="tipo" name="usuario.roles" required>
										<option value="">Selecione</option>
										<option value="ADMIN">Administrador</option>
										<option value="SECRETARIO">Secretario</option>
										<option value="LIDER">Lider</option>
									</select>
								</div>							
								
								<div class="footer d-flex justify-content-end mb-3">
									<button id="btnVoltar" type="button" class="btn btn-secondary me-2">Voltar</button>
									<button id="btnSalvar" class="btn btn-primary">Salvar</button>
								</div>
							</div>
						</div>
					</fieldset>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<div th:replace="~{fragments/modal-mensagem :: modal}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="/js/lib/oanse-lib.js"></script>
	<script src="/js/usuario/formulario.js"></script>
</body>
